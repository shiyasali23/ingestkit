[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ingestkit"
version = "0.1.0"
description = "Pipeline for large scale multimodal data to move from one place to another"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "psutil>=5.9",
    "boto3>=1.34",
    "pyarrow>=15.0",
    "tiffslide>=2.4",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
kubernetes = ["kubernetes>=29.0"]
dev = ["pytest>=8.0", "ruff>=0.4", "moto[s3]>=5.0", "tifffile>=2024.1", "numpy>=1.26"]

[project.scripts]
ingestkit = "ingestkit.command_line:main"

[tool.setuptools.packages.find]
include = ["ingestkit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
