services:
  state-database:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ingestkit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ingestkit_password}
      POSTGRES_DB: ${POSTGRES_DB:-ingestkit_state}
    ports:
      - "5432:5432"
    volumes:
      - state_database_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ingestkit}"]
      interval: 5s
      retries: 10

  object-storage:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ingestkit}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ingestkit_password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - object_storage_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10

  create-buckets:
    image: minio/mc:latest
    depends_on:
      object-storage:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://object-storage:9000 ${MINIO_ROOT_USER:-ingestkit} ${MINIO_ROOT_PASSWORD:-ingestkit_password} &&
      mc mb --ignore-existing local/ingestkit-landing-zone &&
      mc mb --ignore-existing local/ingestkit-destination
      "

volumes:
  state_database_data:
  object_storage_data:
